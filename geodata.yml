name: Update map geodata
# Automatic: exact substation positions (OpenStreetMap, matched to the JAO names by DLR, Zenodo) and real country borders (Natural Earth).
# Runs on the 2nd of every month and on demand. Writes data/static/coordinates_dlr_osm.csv and borders.csv, recalculates the locations and saves everything.
# The workflow 'Build Excel model' starts by itself afterwards.
on:
  schedule:
    - cron: "0 5 2 * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download positions and borders
        id: fetch
        continue-on-error: true            # what could be read is still saved
        run: python scripts/update_geodata.py
      - name: Rebuild delivery files, locations and the map file
        run: |
          python scripts/build_processed.py
          python scripts/estimate_coordinates.py
          python scripts/build_map.py --geojson data/processed/network_map.geojson
      - name: Save changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static data/processed data/manual
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data: map geodata updated ($(date -u +%F))"
            git pull --rebase
            git push
          fi
      - name: Report a failed source as an issue
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Automatic update failed: map geodata"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" --body "A source of the map geodata could not be read; the previous files stay in use. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (step 'Download positions and borders'). Addresses: config/config.yml, section sources.geodata."
          fi
          exit 1
