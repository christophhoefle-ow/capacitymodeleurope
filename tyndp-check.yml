name: Check TYNDP project data
# Downloads the ENTSO-E TYNDP 2024 project data (open copy) and prints its structure; the file is attached to the run (artifact).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download and report structure
        run: python scripts/fetch_tyndp.py
      - uses: actions/upload-artifact@v4
        with:
          name: tyndp_raw
          path: data/raw/tyndp/*
          retention-days: 14
